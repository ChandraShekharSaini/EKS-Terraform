apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ChandraShekharSaini/EKS-Terraform.git
    targetRevision: main
    path: frontend
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: project-1

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true