name: CI/CD for app

on:
  workflow_dispatch:

  # Enable later if you want automatic deployment
  # push:
  #   branches:
  #     - main

# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:
  AWS_REGION: us-east-1

  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

  FRONTEND_REPOSITORY: shopping-site-frontend

  BACKEND_REPOSITORY: shopping-site-backend


# ==========================================================
# GITHUB PERMISSIONS
# ==========================================================

permissions:
  contents: write


# ==========================================================
# JOB
# ==========================================================

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # 1. CHECKOUT
      # ====================================================

      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}


      # ====================================================
      # 2. CONFIGURE AWS
      # ====================================================

      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ====================================================
      # 3. LOGIN TO ECR
      # ====================================================

      - name: 📦 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ====================================================
      # 4. SET IMAGE TAG
      # ====================================================

      - name: 🏷️ Set Docker image tag
        run: |

          IMAGE_TAG="${GITHUB_SHA}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          echo "======================================"
          echo "Docker Image Tag"
          echo "======================================"
          echo "$IMAGE_TAG"


      # ====================================================
      # 5. BUILD FRONTEND
      # ====================================================

      - name: 🐳 Build and Push Frontend
        run: |

          set -e

          REPO_NAME="$FRONTEND_REPOSITORY"

          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "======================================"
          echo "FRONTEND"
          echo "======================================"

          echo "Folder: frontend"
          echo "Repository: $REPO_NAME"
          echo "Image: $IMAGE_URI"


          # ----------------------------------------------
          # Create ECR repository if required
          # ----------------------------------------------

          if ! aws ecr describe-repositories \
            --repository-names "$REPO_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1
          then

            echo "📦 Creating ECR repository..."

            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true

          else

            echo "✅ ECR repository already exists"

          fi


          # ----------------------------------------------
          # Build frontend
          # ----------------------------------------------

          echo "🐳 Building frontend image..."

          docker build \
            -t "$IMAGE_URI" \
            ./frontend


          # ----------------------------------------------
          # Push frontend
          # ----------------------------------------------

          echo "⬆️ Pushing frontend image..."

          docker push "$IMAGE_URI"

          echo "✅ Frontend pushed successfully"

          echo "FRONTEND_IMAGE=$IMAGE_URI" >> $GITHUB_ENV


      # ====================================================
      # 6. BUILD BACKEND
      # ====================================================

      - name: 🐳 Build and Push Backend
        run: |

          set -e

          REPO_NAME="$BACKEND_REPOSITORY"

          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "======================================"
          echo "BACKEND"
          echo "======================================"

          echo "Folder: backend"
          echo "Repository: $REPO_NAME"
          echo "Image: $IMAGE_URI"


          # ----------------------------------------------
          # Create ECR repository if required
          # ----------------------------------------------

          if ! aws ecr describe-repositories \
            --repository-names "$REPO_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1
          then

            echo "📦 Creating ECR repository..."

            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true

          else

            echo "✅ ECR repository already exists"

          fi


          # ----------------------------------------------
          # Build backend
          # ----------------------------------------------

          echo "🐳 Building backend image..."

          docker build \
            -t "$IMAGE_URI" \
            ./backend


          # ----------------------------------------------
          # Push backend
          # ----------------------------------------------

          echo "⬆️ Pushing backend image..."

          docker push "$IMAGE_URI"

          echo "✅ Backend pushed successfully"

          echo "BACKEND_IMAGE=$IMAGE_URI" >> $GITHUB_ENV


      # ====================================================
      # 7. UPDATE KUBERNETES IMAGE
      # ====================================================

      - name: 🔄 Update Kubernetes image
        run: |

          set -e

          echo "======================================"
          echo "UPDATING KUBERNETES MANIFESTS"
          echo "======================================"

          echo "Frontend image:"
          echo "$FRONTEND_IMAGE"

          echo ""

          echo "Backend image:"
          echo "$BACKEND_IMAGE"


          # ==================================================
          # BACKEND DEPLOYMENT
          # ==================================================

          if [ -f "backend/deployment.yml" ]; then

            echo "📝 Updating backend/deployment.yml"

            sed -i \
              "s|image:.*|image: $BACKEND_IMAGE|g" \
              backend/deployment.yml

          else

            echo "⚠️ backend/deployment.yml not found"

          fi


          # ==================================================
          # FRONTEND DEPLOYMENT
          # ==================================================

          if [ -f "frontend/deployment.yml" ]; then

            echo "📝 Updating frontend/deployment.yml"

            sed -i \
              "s|image:.*|image: $FRONTEND_IMAGE|g" \
              frontend/deployment.yml

          else

            echo "⚠️ frontend/deployment.yml not found"

            echo "Frontend deployment may be inside K8-argocd."

          fi


      # ====================================================
      # 8. SHOW IMAGES
      # ====================================================

      - name: 📋 Show ECR images
        run: |

          echo ""
          echo "======================================"
          echo "ECR IMAGES"
          echo "======================================"

          echo ""
          echo "Frontend:"
          echo "$FRONTEND_IMAGE"

          echo ""
          echo "Backend:"
          echo "$BACKEND_IMAGE"


      # ====================================================
      # 9. CHECK GIT CHANGES
      # ====================================================

      - name: 🔍 Check Git changes
        run: |

          git status

          echo ""
          echo "Changed files:"
          git diff --name-only


      # ====================================================
      # 10. COMMIT AND PUSH
      # ====================================================

      - name: 🔄 Commit updated Kubernetes YAML
        run: |

          git config user.name "YOUR_GITHUB_USERNAME"

          git config user.email "YOUR_GITHUB_EMAIL"


          # Add backend deployment

          git add backend/deployment.yml


          # Add frontend deployment if it exists

          if [ -f "frontend/deployment.yml" ]; then
            git add frontend/deployment.yml
          fi


          # Add K8-argocd manifests if they contain deployments

          git add K8-argocd/ 2>/dev/null || true


          # Commit

          git commit \
            -m "🔄 Update ECR image tags [skip ci]" \
            || echo "ℹ️ No changes to commit"


          # Push

          git push origin main \
            || echo "ℹ️ Nothing to push"


      # ====================================================
      # 11. FINAL STATUS
      # ====================================================

      - name: 🔍 Final Git status
        run: |

          echo "======================================"
          echo "FINAL GIT STATUS"
          echo "======================================"

          git status


      # ====================================================
      # 12. COMPLETE
      # ====================================================

      - name: ✅ Pipeline completed
        run: |

          echo ""
          echo "======================================"
          echo "CI/CD PIPELINE COMPLETED"
          echo "======================================"

          echo "✅ Frontend Docker image built"

          echo "✅ Frontend image pushed to ECR"

          echo "✅ Backend Docker image built"

          echo "✅ Backend image pushed to ECR"

          echo "✅ Kubernetes image updated"

          echo "✅ Git changes pushed"

          echo ""

          echo "Argo CD will detect the Git change."

          echo "======================================"
