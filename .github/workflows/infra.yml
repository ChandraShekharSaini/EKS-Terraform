name: CI/CD for app

on:
  workflow_dispatch:

  # Uncomment when you want automatic deployment on push
  # push:
  #   branches:
  #     - main


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:
  AWS_REGION: us-east-1

  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"

  BACKEND_SERVICE: "backend"


# ==========================================================
# GITHUB PERMISSIONS
# ==========================================================

permissions:
  contents: write


# ==========================================================
# JOB
# ==========================================================

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # 1. CHECKOUT REPOSITORY
      # ====================================================

      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

        with:
          token: ${{ secrets.GIT_PAT }}


      # ====================================================
      # 2. CONFIGURE AWS
      # ====================================================

      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ====================================================
      # 3. LOGIN TO AMAZON ECR
      # ====================================================

      - name: 📦 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ====================================================
      # 4. SET IMAGE TAG
      # ====================================================

      - name: 🏷️ Set Docker image tag
        run: |

          IMAGE_TAG="${GITHUB_SHA}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          echo "======================================"
          echo "Docker Image Tag"
          echo "======================================"
          echo "$IMAGE_TAG"


      # ====================================================
      # 5. BUILD AND PUSH FRONTEND + BACKEND
      # ====================================================

      - name: 🛠 Build and Push Docker Images
        run: |

          set -e

          echo "======================================"
          echo "Starting Docker Build and Push"
          echo "======================================"

          echo "AWS Region: $AWS_REGION"
          echo "ECR Registry: $ECR_REGISTRY"
          echo "Image Tag: $IMAGE_TAG"

          # ==================================================
          # FRONTEND SERVICES
          # ==================================================

          echo ""
          echo "======================================"
          echo "FRONTEND SERVICES"
          echo "======================================"

          for service in $FRONTEND_SERVICES; do

            FOLDER="frontend/$service"

            REPO_NAME="shopping-site-$service"

            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"


            # ----------------------------------------------
            # Check Dockerfile
            # ----------------------------------------------

            if [ ! -f "$FOLDER/Dockerfile" ]; then

              echo "⚠️ No Dockerfile found in $FOLDER"

              echo "Skipping $service"

              continue

            fi


            echo ""
            echo "🚀 Building frontend service: $service"

            echo "📁 Folder: $FOLDER"

            echo "📦 ECR Repository: $REPO_NAME"

            echo "🐳 Image: $IMAGE_URI"


            # ----------------------------------------------
            # Create ECR repository if it doesn't exist
            # ----------------------------------------------

            if ! aws ecr describe-repositories \
              --repository-names "$REPO_NAME" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1
            then

              echo "📦 Creating ECR repository: $REPO_NAME"

              aws ecr create-repository \
                --repository-name "$REPO_NAME" \
                --region "$AWS_REGION" \
                --image-scanning-configuration scanOnPush=true

            else

              echo "✅ ECR repository already exists: $REPO_NAME"

            fi


            # ----------------------------------------------
            # Docker Build
            # ----------------------------------------------

            echo "🐳 Building Docker image..."

            docker build \
              -t "$IMAGE_URI" \
              "$FOLDER"


            # ----------------------------------------------
            # Docker Push
            # ----------------------------------------------

            echo "⬆️ Pushing image to ECR..."

            docker push "$IMAGE_URI"


            # ----------------------------------------------
            # Update Kubernetes deployment
            # ----------------------------------------------

            if [ -f "$FOLDER/deployment.yml" ]; then

              echo "📝 Updating deployment.yml"

              sed -i \
                "s|image:.*|image: $IMAGE_URI|g" \
                "$FOLDER/deployment.yml"

            else

              echo "⚠️ deployment.yml not found in $FOLDER"

            fi

          done


          # ==================================================
          # BACKEND
          # ==================================================

          echo ""
          echo "======================================"
          echo "BACKEND"
          echo "======================================"

          FOLDER="backend"

          REPO_NAME="shopping-site-backend"

          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"


          echo "🚀 Building backend"

          echo "📁 Folder: $FOLDER"

          echo "📦 ECR Repository: $REPO_NAME"

          echo "🐳 Image: $IMAGE_URI"


          # ----------------------------------------------
          # Create backend ECR repository
          # ----------------------------------------------

          if ! aws ecr describe-repositories \
            --repository-names "$REPO_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1
          then

            echo "📦 Creating backend ECR repository"

            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true

          else

            echo "✅ Backend ECR repository already exists"

          fi


          # ----------------------------------------------
          # Build backend
          # ----------------------------------------------

          echo "🐳 Building backend Docker image..."

          docker build \
            -t "$IMAGE_URI" \
            "$FOLDER"


          # ----------------------------------------------
          # Push backend
          # ----------------------------------------------

          echo "⬆️ Pushing backend image to ECR..."

          docker push "$IMAGE_URI"


          # ----------------------------------------------
          # Update backend Kubernetes YAML
          # ----------------------------------------------

          if [ -f "$FOLDER/backend-deployment.yml" ]; then

            echo "📝 Updating backend-deployment.yml"

            sed -i \
              "s|image:.*|image: $IMAGE_URI|g" \
              "$FOLDER/backend-deployment.yml"

          else

            echo "⚠️ backend-deployment.yml not found"

          fi


      # ====================================================
      # 6. SHOW ECR IMAGES
      # ====================================================

      - name: 📋 Show ECR image URIs
        run: |

          echo ""
          echo "======================================"
          echo "DOCKER IMAGES PUSHED TO ECR"
          echo "======================================"

          echo ""

          echo "Frontend Images:"
          echo "--------------------------------------"

          for service in $FRONTEND_SERVICES; do

            echo "$ECR_REGISTRY/shopping-site-$service:$IMAGE_TAG"

          done


          echo ""

          echo "Backend Image:"
          echo "--------------------------------------"

          echo "$ECR_REGISTRY/shopping-site-backend:$IMAGE_TAG"

          echo ""

          echo "======================================"
          echo "ECR PUSH COMPLETED"
          echo "======================================"


      # ====================================================
      # 7. COMMIT UPDATED KUBERNETES YAML
      # ====================================================

      - name: 🔄 Commit updated YAML files
        run: |

          git config --global user.name "YOUR_GITHUB_USERNAME"

          git config --global user.email "YOUR_GITHUB_EMAIL"


          echo "Checking Git changes..."

          git status


          # Add frontend deployments

          git add frontend/**/deployment.yml


          # Add backend deployment

          git add backend/backend-deployment.yml


          # Commit changes

          git commit \
            -m "🔄 Update image tags after build [skip ci]" \
            || echo "ℹ️ No changes to commit"


          # Push changes

          git push origin main \
            || echo "ℹ️ Nothing to push"


      # ====================================================
      # 8. VERIFY FINAL GIT STATUS
      # ====================================================

      - name: 🔍 Verify Git status
        run: |

          echo "======================================"

          echo "Final Git Status"

          echo "======================================"

          git status


      # ====================================================
      # 9. COMPLETION MESSAGE
      # ====================================================

      - name: ✅ Deployment pipeline completed
        run: |

          echo ""
          echo "======================================"
          echo "CI/CD PIPELINE COMPLETED"
          echo "======================================"

          echo "✅ Source code checked out"

          echo "✅ AWS credentials configured"

          echo "✅ ECR login successful"

          echo "✅ Frontend images built"

          echo "✅ Frontend images pushed to ECR"

          echo "✅ Backend image built"

          echo "✅ Backend image pushed to ECR"

          echo "✅ Kubernetes YAML updated"

          echo "✅ YAML changes committed"

          echo "✅ YAML changes pushed to GitHub"

          echo ""

          echo "Argo CD can now detect the Git changes."

          echo "======================================"
